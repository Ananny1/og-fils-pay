# The only public entry point of the hosted stack (ops/docker-compose.prod.yml).
#   /v1/*, /healthz, /readyz -> api:3000
#   /admin/*                 -> staff console (static, SPA fallback)
#   everything else          -> shop app + checkout (static, SPA fallback)

# Docker's embedded DNS: re-resolve "api" so a restarted api container is
# found again without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;   # KYC uploads are capped at 8 MB by the api

    # nginx drops server-level add_header in any location that has its own
    # add_header, so every such location includes the same snippet.
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    set $api_upstream http://api:3000;

    location /v1/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Fail fast instead of queueing: an api that is down or restarting
        # gives a quick 503 + Retry-After (below), never a hanging request.
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_intercept_errors off;
        error_page 502 504 = @api_unavailable;
    }

    location = /healthz { proxy_pass $api_upstream; error_page 502 504 = @api_unavailable; }
    location = /readyz  { proxy_pass $api_upstream; error_page 502 504 = @api_unavailable; }

    location @api_unavailable {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Retry-After 2 always;
        add_header Cache-Control no-store always;
        return 503 '{"error":"service_unavailable","message":"Please retry shortly"}';
    }

    location /admin/assets/ {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control no-cache;
    }

    location = /admin { return 301 /admin/; }

    location /assets/ {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control no-cache;
    }
}
