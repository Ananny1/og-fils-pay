# The only public entry point of the hosted stack (ops/docker-compose.prod.yml).
#   /v1/*, /healthz, /readyz -> api:3000
#   /admin/*                 -> staff console (static, SPA fallback)
#   everything else          -> shop app + checkout (static, SPA fallback)

# SEC-5 edge rules (per-IP rate + connection limits, slow-client timeouts,
# real client IP to the api), http-level part. Thresholds: docs/challenge/DDOS.md
# and docs/bugs/HOST-2-edge-limits-in-prod.md.
include /etc/nginx/filspay/security.conf;

# Docker's embedded DNS: re-resolve "api" so a restarted api container is
# found again without restarting nginx (`resolve` below, nginx >= 1.27.3).
resolver 127.0.0.11 valid=10s ipv6=off;

# CAP-1 overload valve, HOST-2 version: one GLOBAL cap on requests the api is
# working on (not per IP: a load test, or a whole office behind one NAT, comes
# from a single address). It is counted on the connections to the api, which
# nginx opens only after it has read the whole request, so slow clients that
# trickle headers or a body never take a slot (a `limit_conn` on /v1 did: 28
# slow connections from one IP gave every buyer a 503). Over the cap nginx
# answers 503 + Retry-After itself, which costs far less CPU than letting the
# api (0.5 vCPU) shed. Keep it a little above API_MAX_IN_FLIGHT.
upstream filspay_api {
    zone filspay_api 64k;
    server api:3000 resolve max_conns=28 max_fails=0;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    # SEC-5, server-level part: per-IP limits + JSON 429, slow-client
    # timeouts, 1 MB body cap (9 MB KYC upload, 6 MB adjustment import),
    # buffered access log, proxy headers (X-Forwarded-For overwritten with the
    # real client IP). Locations below must not set limit_req, limit_conn,
    # proxy_set_header or access_log, or they lose these (nginx does not merge
    # a directive a location sets itself).
    include /etc/nginx/filspay/security-server.conf;

    # nginx drops server-level add_header in any location that has its own
    # add_header, so every such location includes the same snippet.
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /v1/ {
        proxy_pass http://filspay_api;
        # Fail fast instead of queueing: an api that is down, restarting or
        # at its in-flight cap gives a quick 503 + Retry-After (below), never
        # a hanging request.
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_intercept_errors off;
        # error_page is not merged either: keep the edge's JSON 429 here.
        error_page 429 @filspay_rate_limited;
        error_page 502 503 504 = @api_unavailable;
    }

    location = /healthz { proxy_pass http://filspay_api; error_page 429 @filspay_rate_limited; error_page 502 504 = @api_unavailable; }
    location = /readyz  { proxy_pass http://filspay_api; error_page 429 @filspay_rate_limited; error_page 502 504 = @api_unavailable; }

    location @api_unavailable {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Retry-After 2 always;
        add_header Cache-Control no-store always;
        return 503 '{"error":"service_unavailable","message":"Please retry shortly"}';
    }

    location /admin/assets/ {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control no-cache;
    }

    location = /admin { return 301 /admin/; }

    location /assets/ {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control no-cache;
    }
}
