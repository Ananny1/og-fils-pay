# FilsPay edge protection, part 1 of 2: http {} level (SEC-5).
#
# Rule-based abuse / DDoS protection for the nginx that fronts the static
# dashboards and proxies /v1 to apps/api. Layers and thresholds are explained
# in plain words in docs/challenge/DDOS.md.
#
# HOW TO INCLUDE (two files, because nginx only accepts zones at http level
# and access rules at server level):
#
#   http {                                   # or a conf.d/*.conf file, which
#       include /etc/nginx/filspay/security.conf;   # stock nginx already
#                                                   # loads inside http {}
#       upstream filspay_api { server api:3000; keepalive 16; }
#
#       server {
#           listen 80;
#           include /etc/nginx/filspay/security-server.conf;   # FIRST line
#           location /    { root /usr/share/nginx/html; try_files ... ; }
#           location /v1/ { proxy_pass http://filspay_api; }
#       }
#   }
#
# Rules for the server that includes these files:
#   - The upstream for apps/api must be called `filspay_api` (the upload
#     location in security-server.conf proxies to it).
#   - Don't put `limit_req`, `proxy_set_header` or `access_log` inside your own
#     locations: nginx drops ALL inherited values of a directive as soon as a
#     block sets one of its own, which would silently remove the limits or let
#     a client-sent X-Forwarded-For through.
#   - This file only adds directives the stock nginx.conf does not set
#     (keepalive_timeout lives in security-server.conf for that reason), so it
#     passes `nginx -t` next to the image's own http {} defaults.
#
# All state below is per nginx instance and bounded: each zone is a fixed
# 10 MB shared-memory table (~160k client IPs) that evicts the oldest entries
# when full. Shared limits across several API instances live in Postgres
# (SEC-1); this layer only has to stop the flood before it reaches them.

# --- Client IP ---------------------------------------------------------------
# nginx is the first hop, so $remote_addr is the real client. If a cloud load
# balancer is ever put in front, trust ONLY its address range here, otherwise
# every client would share the balancer's IP (or could spoof one):
#
#   set_real_ip_from 10.0.0.0/8;          # the balancer's private range only
#   real_ip_header   X-Forwarded-For;
#   real_ip_recursive on;

# --- Which bucket a request falls in ------------------------------------------
# $uri is the decoded, normalised path (merge_slashes is on), so tricks like
# //v1//auth/login or %2Fv1 still land in the right class.
map $uri $filspay_limit_class {
    ~^/v1/(admin/)?auth/                 auth;     # login, OTP verify/resend
    ~^/v1/payment-links/[^/]+/pay$       pay;      # card payment
    ~^/v1/refunds(/|$)                   pay;      # refund initiation
    ~^/v1/acquirer/                      bank;     # acquirer callbacks
    ~^/v1/                               api;      # everything else in the API
    default                              static;   # dashboards' HTML/JS/CSS
}

# One key per zone. An empty key means "not counted in this zone", so every
# request is counted in exactly one request zone.
map $filspay_limit_class $filspay_key_auth   { auth   $binary_remote_addr; default ""; }
map $filspay_limit_class $filspay_key_pay    { pay    $binary_remote_addr; default ""; }
map $filspay_limit_class $filspay_key_bank   { bank   $binary_remote_addr; default ""; }
map $filspay_limit_class $filspay_key_api    { api    $binary_remote_addr; default ""; }
map $filspay_limit_class $filspay_key_static { static $binary_remote_addr; default ""; }

# --- Request-rate zones (per client IP) ----------------------------------------
# auth:   1/s,  burst 5   a person needs ~3 calls to log in; brute force needs thousands
# pay:    3/s,  burst 10  a checkout is 1-2 calls; this stops card-testing scripts
# api:    10/s, burst 20  a dashboard page loads ~5-10 API calls at once
# static: 30/s, burst 60  first dashboard load pulls a handful of JS/CSS/font files
# bank:   50/s, burst 100 acquirer callbacks arrive from a few IPs in batches
#         (in production, also allowlist the acquirer's IP range)
limit_req_zone $filspay_key_auth   zone=filspay_req_auth:10m   rate=1r/s;
limit_req_zone $filspay_key_pay    zone=filspay_req_pay:10m    rate=3r/s;
limit_req_zone $filspay_key_api    zone=filspay_req_api:10m    rate=10r/s;
limit_req_zone $filspay_key_static zone=filspay_req_static:10m rate=30r/s;
limit_req_zone $filspay_key_bank   zone=filspay_req_bank:10m   rate=50r/s;

# Open connections per client IP (a browser opens about 6).
limit_conn_zone $binary_remote_addr zone=filspay_conn:10m;

# "Slow down" is 429, not nginx's default 503: 503 is reserved for the API's
# own overload valve, so the two layers can be told apart in logs and alerts.
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level  warn;
limit_conn_log_level warn;

# --- Floods must be visible ------------------------------------------------------
# $limit_req_status / $limit_conn_status are PASSED, DELAYED or REJECTED (or
# "-" when the request was not counted), so `grep REJECTED` on the access log
# shows who is being cut, on which path, and how often.
log_format filspay_edge '$remote_addr [$time_local] "$request" $status '
                        '$body_bytes_sent rt=$request_time '
                        'class=$filspay_limit_class '
                        'limit_req=$limit_req_status limit_conn=$limit_conn_status '
                        'ua="$http_user_agent"';

# --- Don't advertise the version -------------------------------------------------
server_tokens off;
