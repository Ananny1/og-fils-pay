# SEC-5 test harness: a fake API. Every request gets 200 and a body that
# echoes the client-IP headers it received, so the test can check that the
# edge overwrote anything the client sent. /static/big.bin is a 2 MB file
# used to hold connections open for the limit_conn test.

server {
    listen 80;
    client_max_body_size 20m;

    location = /static/big.bin {
        root /srv;
    }

    location / {
        default_type text/plain;
        return 200 "ok real=$http_x_real_ip xff=$http_x_forwarded_for\n";
    }
}
