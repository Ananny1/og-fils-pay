# SEC-5 test harness: the smallest front that uses the two security includes
# exactly the way the production nginx must (see ops/nginx/security.conf).
# Mounted as /etc/nginx/conf.d/default.conf in stock nginx:1.27-alpine, so it
# sits inside the image's own http {} block, next to its default directives.

include /etc/nginx/filspay/security.conf;

upstream filspay_api {
    server upstream:80;
    keepalive 16;
}

server {
    listen 80;
    include /etc/nginx/filspay/security-server.conf;

    # Stands in for the static dashboards (apps/web, apps/admin).
    location / {
        proxy_pass http://filspay_api;
    }

    location /v1/ {
        proxy_pass http://filspay_api;
    }
}
