# FilsPay edge protection, part 2 of 2: server {} level (SEC-5).
#
# Include as the FIRST line of the server {} block, after
# ops/nginx/security.conf is included at http level (see that file for the
# full example and the rules your own locations must follow).

access_log /var/log/nginx/access.log filspay_edge;

# --- Rate and connection limits ---------------------------------------------------
# All five zones are listed; each request has a key in only one of them (see
# the maps in security.conf), so only that zone applies. nodelay = answer the
# burst at full speed, then 429 straight away instead of queueing.
limit_req  zone=filspay_req_auth   burst=5   nodelay;
limit_req  zone=filspay_req_pay    burst=10  nodelay;
limit_req  zone=filspay_req_api    burst=20  nodelay;
limit_req  zone=filspay_req_static burst=60  nodelay;
limit_req  zone=filspay_req_bank   burst=100 nodelay;
limit_conn filspay_conn 20;

# A 429 from the edge looks like a 429 from the API ({"error": "..."}), so
# the dashboards show the same "slow down" message for both.
error_page 429 @filspay_rate_limited;
location @filspay_rate_limited {
    default_type application/json;
    add_header Retry-After 1 always;
    return 429 '{"error":"rate_limited","message":"too many requests, slow down"}\n';
}

# --- Slow-client (Slowloris) protection ------------------------------------------
# Each is the longest gap nginx waits between two reads/writes, not a total, so
# a big upload on a slow line still works as long as it keeps moving.
client_header_timeout 10s;
client_body_timeout   10s;
send_timeout          10s;
keepalive_timeout     15s;
keepalive_requests    1000;
reset_timedout_connection on;

# --- Request size ---------------------------------------------------------------------
# 1 MB matches apps/api's own JSON body limit (Fastify default), so oversized
# bodies are refused here, before they use any API memory.
client_max_body_size 1m;
client_header_buffer_size   1k;
large_client_header_buffers 4 8k;   # longer headers/URLs get 400/414

# --- Real client IP to the API ------------------------------------------------------
# Overwrite (never append to) whatever the client sent, so the API's limiter
# and audit log (SEC-1, TRUST_PROXY=true behind this proxy) see the true IP.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";
proxy_http_version 1.1;
proxy_connect_timeout 5s;
proxy_hide_header X-Powered-By;

# --- Methods and hidden files ---------------------------------------------------------
# Checked before any location is chosen, so no location can bypass them.
# The API uses no PUT; TRACE/CONNECT/WebDAV methods have no business here.
if ($request_method !~ ^(GET|HEAD|POST|PATCH|DELETE|OPTIONS)$) {
    return 405;
}
# /.env, /.git/config, /assets/.htpasswd ... (but keep /.well-known/ for TLS).
if ($uri ~ "/\.(?!well-known/)") {
    return 404;
}

# --- The one place a bigger body is allowed ------------------------------------------
# KYC upload: apps/api caps the file at 8 MiB (KYC_MAX_FILE_SIZE_BYTES);
# 9 MB leaves room for the multipart wrapper.
location ~ ^/v1/merchants/[^/]+/kyc/documents$ {
    client_max_body_size 9m;
    proxy_pass http://filspay_api;
}
