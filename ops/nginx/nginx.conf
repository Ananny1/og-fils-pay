user  nginx;
# One vCPU box: one worker is enough and leaves CPU for the API and Postgres.
worker_processes  1;
worker_rlimit_nofile 8192;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                      'rt=$request_time urt=$upstream_response_time "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    server_tokens   off;

    # --- client timeouts: slow clients cannot hold connections open -------
    client_header_timeout 10s;
    client_body_timeout   15s;
    send_timeout          15s;
    keepalive_timeout     30s;
    keepalive_requests    1000;
    # KYC documents are up to 8 MiB (KYC_MAX_FILE_SIZE_BYTES); everything
    # else is small JSON (the API itself caps JSON at BODY_LIMIT_BYTES).
    client_max_body_size  10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript
               application/xml image/svg+xml text/csv;

    # Docker's embedded DNS, so `server api:3000 resolve` follows the API
    # container to a new IP after it is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}
